<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Alkitab Millionaire</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Style Tambahan Khusus Layar Pembuka Agar Rapi */
        .welcome-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0c1446 0%, #03071e 80%, #000000 100%);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 25px;
            padding: 20px;
        }
        .welcome-overlay h1 {
            color: #00b4d8;
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(0, 180, 216, 0.6);
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-mulai-game {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(90deg, #ff9f1c, #ffbf69);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 159, 28, 0.5);
            color: #000;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }
        .btn-mulai-game:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 159, 28, 0.8);
        }
    </style>
</head>
<body>

    <div id="layar-mulai" class="welcome-overlay">
        <h1>Kuis Alkitab Millionaire</h1>
        <button class="btn-mulai-game" onclick="mulaiPermainanPertamaKali()">
            MULAI GAME
        </button>
    </div>

    <canvas id="canvas-kembang-api"></canvas>

    <div class="game-container">
        <div class="main-area">
            <div class="header">
                <h2>Kuis Alkitab</h2>
                <div id="hadiah-sekarang" class="current-prize-text">Hadiah: Rp 0</div>
                <div class="lifelines">
                    <button id="btn-5050" onclick="gunakan5050()">50 : 50</button>
                </div>
            </div>

            <div id="area-ayat" class="ayat-box">
                Loading ayat penyemangat...
            </div>

            <div class="quiz-box">
                <div id="teks-pertanyaan">Memuat soal...</div>
                
                <div class="pilihan-kontainer">
                    <button class="btn-pilihan" onclick="cekJawaban(this)"></button>
                    <button class="btn-pilihan" onclick="cekJawaban(this)"></button>
                    <button class="btn-pilihan" onclick="cekJawaban(this)"></button>
                    <button class="btn-pilihan" onclick="cekJawaban(this)"></button>
                </div>
            </div>
        </div>

        <div class="money-tree" id="money-tree"></div>
    </div>

    <div id="modal-konfirmasi" class="modal">
        <div class="modal-content">
            <h3>Apakah Anda yakin dengan jawaban ini?</h3>
            <div class="modal-buttons">
                <button id="btn-yakin-ya" class="btn-modal ya">Ya, Yakin</button>
                <button id="btn-yakin-tidak" class="btn-modal tidak">Tidak, Ganti</button>
            </div>
        </div>
    </div>

    <div id="container-notifikasi" class="notification-container"></div>

    <script src="ayat.js"></script>
    <script src="app.js"></script>
</body>
</html>
